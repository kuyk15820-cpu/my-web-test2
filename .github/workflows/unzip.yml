name: Build Repo UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      # ย้ายมาไว้หลัง npm install เพื่อให้แสดงเวอร์ชัน Current ตามจริง
      - name: Check Package Versions
        run: npm outdated || true

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build-output
          path: dist/
          retention-days: 7
